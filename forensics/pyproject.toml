[project]
name = "body-double-forensics"
version = "0.1.0"
description = "Body Double forensics side: Investigator (planner, analyst, reporter), twin agent, detonation sandbox"
requires-python = ">=3.12"
dependencies = [
    "body-double-contracts",
    "httpx>=0.27",
    "openai>=1.40",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

# The repo root (contracts/) is consumed as an editable path dependency so
# `import contracts` works in tests and in the twin agent. Never edit contracts/.
[tool.uv.sources]
body-double-contracts = { path = "..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bd_forensics"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
