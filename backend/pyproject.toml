[project]
name = "body-double-backend"
version = "0.1.0"
description = "Body Double control plane (FastAPI): case state machine, Vultr twin builder, twin channel, hash-chained log"
requires-python = ">=3.12"
dependencies = [
    "body-double-contracts",
    "body-double-forensics",
    "fastapi>=0.115",
    "uvicorn>=0.31",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

# contracts live at the repo root; editable so `import contracts` always tracks it
[tool.uv.sources]
body-double-contracts = { path = "..", editable = true }
body-double-forensics = { path = "../forensics", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
