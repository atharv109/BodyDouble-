# iso/boot/isolinux.cfg - BIOS boot menu (isolinux, from the syslinux
# package; xorriso writes the isohybrid MBR so the .iso also boots from
# disk). No command-line or block-device configuration is accepted. The
# sole deploy input is strictly validated link-local Vultr user_data.

DEFAULT bd
PROMPT 0
TIMEOUT 10

LABEL bd
  KERNEL /boot/vmlinuz-lts
  INITRD /boot/initramfs-bd
  APPEND console=tty0 console=ttyS0,115200
