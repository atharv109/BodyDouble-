# iso/boot/isolinux.cfg - BIOS boot menu (isolinux, from the syslinux
# package; xorriso writes the isohybrid MBR so the .iso also boots from
# disk). The bd.* boot parameters are the DEPLOY-TIME injection point for
# the non-secret subnet/device config: the ISO itself ships no case values,
# one-time token or keys. The token comes only from link-local user_data. A deploy step
# that cannot set kernel args writes a bd-deploy.env file onto an attached
# device instead; the initramfs picks that up.
#
# deploy step appends to APPEND, e.g.:
#   bd.subnet=10.99.0.0/20 bd.vpc_ip=10.99.0.20 bd.disk=/dev/vdb

DEFAULT bd
PROMPT 0
TIMEOUT 10

LABEL bd
  KERNEL /boot/vmlinuz-lts
  INITRD /boot/initramfs-bd
  APPEND console=tty0 console=ttyS0,115200
