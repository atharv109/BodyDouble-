[project]
name = "body-double-contracts"
version = "0.1.0"
description = "Body Double shared contracts (models, API, SSE events, VultrClient)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["contracts/tests"]
